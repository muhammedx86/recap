[workspace]
resolver = "2"
members = ["crates/recap-core", "crates/recap-recorder", "crates/sample-game", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ywillxia/recap"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
