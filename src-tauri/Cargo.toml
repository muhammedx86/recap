[package]
name = "recap"
description = "Recap: a lightweight, local-only game recorder with data-file event detectors"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "recap_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
recap-core = { path = "../crates/recap-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
uuid.workspace = true
image.workspace = true
base64.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
