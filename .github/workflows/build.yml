name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-obs-build queries the GitHub API for OBS releases; the token lifts the rate limit.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    name: Core tests + UI build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-core

      - name: Test recap-core
        run: cargo test -p recap-core --locked

      - name: Clippy recap-core
        run: cargo clippy -p recap-core --all-targets --locked -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install, typecheck, build
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run build

  windows:
    name: Windows app + installer
    runs-on: windows-latest
    permissions:
      contents: write # publishes E2E results to the e2e-results branch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-app

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      # ---- OBS (libobs) runtime -------------------------------------------------
      - name: Cache cargo-obs-build
        id: obsbuild-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-obs-build.exe
          key: cargo-obs-build-2.0.3-${{ runner.os }}

      - name: Install cargo-obs-build
        if: steps.obsbuild-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-obs-build --version 2.0.3 --locked

      - name: Cache OBS binaries
        uses: actions/cache@v4
        with:
          path: obs-build
          key: obs-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Run from the workspace root: cargo-obs-build reads `cargo metadata` to find the
      # `libobs` crate version and downloads the matching OBS Studio release.
      - name: Download OBS runtime into src-tauri/obs
        run: cargo obs-build build --out-dir src-tauri/obs --cache-dir obs-build --remove-pdbs

      # ---- Recorder sidecar ---------------------------------------------------
      - name: Clippy recorder
        continue-on-error: true
        run: cargo clippy -p recap-recorder --release --locked -- -D warnings

      - name: Build recorder sidecar
        run: cargo build -p recap-recorder --release --locked

      - name: Place recorder next to OBS DLLs
        shell: pwsh
        run: Copy-Item target/release/recap-recorder.exe src-tauri/obs/ -Force

      # ---- ffmpeg / ffprobe (GPL build; Recap is GPL-3.0-or-later) -------------
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-btbn-win64-gpl-${{ runner.os }}-v1

      - name: Download ffmpeg + ffprobe
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item $bin.FullName src-tauri/binaries/ -Force
          Copy-Item (Join-Path $bin.DirectoryName "ffprobe.exe") src-tauri/binaries/ -Force

      # ---- App + installer -----------------------------------------------------
      - name: Build Tauri app
        env:
          # Hooks (npm run build) run in the frontend folder.
          TAURI_FRONTEND_PATH: ui
        run: npx --yes @tauri-apps/cli@2 build --ci

      # Tauri copies bundle resources next to the built exe; make sure folders kept their structure.
      - name: Verify bundled resource layout
        shell: pwsh
        run: |
          $need = @(
            "target/release/games/valorant/game.json",
            "target/release/games/cs2/game.json",
            "target/release/obs/recap-recorder.exe",
            "target/release/binaries/ffmpeg.exe"
          )
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error "Missing bundled resources: $missing"; Get-ChildItem target/release -Depth 1 | Out-String | Write-Host; exit 1 }
          Get-ChildItem target/release/obs -Directory | Select-Object -ExpandProperty Name | Write-Host

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $out = "portable/Recap"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item target/release/recap.exe $out/
          Copy-Item src-tauri/obs "$out/obs" -Recurse -Force
          Copy-Item src-tauri/binaries "$out/binaries" -Recurse -Force
          Copy-Item games "$out/games" -Recurse -Force
          Copy-Item LICENSE, README.md $out/

      # ---- End-to-end test: the packaged app against the scripted sample game ----
      - name: Build sample game
        run: cargo build -p recap-sample-game --release --locked

      # Hosted runners default to 1024x768; games are usually 1080p. Best effort: the driver
      # also shrinks the sample game window if the screen stays small.
      - name: Set a 1080p display
        shell: pwsh
        continue-on-error: true
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { Write-Host "Set-DisplayResolution unavailable: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # Screen readers use the OCR engine built into Windows; server images may lack the language data.
      - name: Ensure Windows OCR (en-US)
        shell: pwsh
        continue-on-error: true
        run: |
          $cap = Get-WindowsCapability -Online | Where-Object Name -like "Language.OCR*en-US*" | Select-Object -First 1
          Write-Host "OCR capability: $($cap.Name) $($cap.State)"
          if ($cap -and $cap.State -ne "Installed") { Add-WindowsCapability -Online -Name $cap.Name | Out-Host }

      - name: End-to-end test
        shell: pwsh
        run: ./scripts/e2e.ps1 -AppDir portable/Recap -GameExe target/release/recap-sample-game.exe -Out e2e-out

      # Results also go to the e2e-results branch so they can be read with plain git.
      - name: Publish end-to-end results to a branch
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (-not (Test-Path e2e-out)) { exit 0 }
          $dst = Join-Path $env:RUNNER_TEMP "e2e-results"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem e2e-out -File | Where-Object { $_.Extension -in ".json", ".txt", ".log" } | Copy-Item -Destination $dst
          if (Test-Path e2e-out/screenshots) { Copy-Item e2e-out/screenshots "$dst/screenshots" -Recurse }
          Set-Content "$dst/RUN.txt" "run ${{ github.run_id }} sha ${{ github.sha }} ref ${{ github.ref }}"
          Set-Location $dst
          git init -q -b e2e-results
          git config user.name "recap-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A; git commit -q -m "E2E results for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" e2e-results

      - name: Upload end-to-end results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recap-e2e
          path: |
            e2e-out/report.json
            e2e-out/summary.txt
            e2e-out/*.log
            e2e-out/screenshots/
            e2e-out/recordings/
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: recap-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: recap-portable
          path: portable/Recap
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recap-installer
          path: dist/installer

      - uses: actions/download-artifact@v4
        with:
          name: recap-portable
          path: dist/portable/Recap

      - name: Zip portable build
        run: cd dist/portable && zip -qr ../Recap-portable-${{ github.ref_name }}.zip Recap

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/*.exe
            dist/Recap-portable-${{ github.ref_name }}.zip
          generate_release_notes: true
